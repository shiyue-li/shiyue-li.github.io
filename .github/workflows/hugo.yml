# Builds the CV and the site with Hugo and publishes them to GitHub Pages (www.shiyue.li)
# on every push to master. It can also be run by hand from the Actions tab.
#
# Based on Hugo's official workflow:
# https://gohugo.io/host-and-deploy/deploy-to-github-pages/
# with the Go, Node.js and Dart Sass steps removed, since this site uses none.
name: Build and deploy
env:
  # Same Hugo version as the local Mac install, so builds match.
  # The math typesetting needs 0.141 or newer.
  HUGO_VERSION: 0.147.3

  # Used for any dates Hugo prints on the site
  TZ: America/Detroit
on:
  push:
    branches:
      - master
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: false

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install Hugo
        run: |
          echo "Installing Hugo ${HUGO_VERSION} (extended)..."
          curl -sfL --output-dir "${{ runner.temp }}" -O "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "${{ runner.temp }}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: Log Hugo version
        run: hugo version

      - name: Configure Git
        run: git config --global core.quotepath false

      # Typesets the CV from cv/ and data/*.yaml into static/shiyueli-cv.pdf,
      # so the website's "Curriculum Vitae" link is always current. If it
      # fails, the deploy stops and the live site stays as it was.
      - name: Build CV
        env:
          # TeX Live's official image, full scheme (XeLaTeX, EB Garamond, Libertinus)
          TEXLIVE_IMAGE: texlive/texlive:latest
        run: |
          python3 -c 'import yaml' 2>/dev/null || sudo apt-get install -y python3-yaml
          sh cv/build.sh

      - name: Cache restore
        id: cache-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/.cache/hugo
          key: hugo-${{ github.run_id }}
          restore-keys: hugo-

      - name: Build
        run: |
          echo "Building the site..."
          hugo build \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/" \
            --cacheDir "${{ runner.temp }}/.cache/hugo"

      - name: Cache save
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/.cache/hugo
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          include-hidden-files: false
          path: ./public
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
