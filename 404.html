        <script>
    (function () {
        
        var nav = document.querySelector(".site-nav");
        if (nav) {
            var onScroll = function () { nav.classList.toggle("is-scrolled", window.scrollY > 8); };
            window.addEventListener("scroll", onScroll, { passive: true });
            onScroll();
        }

        
        var links = Array.prototype.slice.call(document.querySelectorAll('.nav-links a[href^="#"]'));
        if (links.length && "IntersectionObserver" in window) {
            var byId = {};
            links.forEach(function (a) { byId[a.hash.slice(1)] = a; });
            var observer = new IntersectionObserver(function (entries) {
                entries.forEach(function (entry) {
                    if (!entry.isIntersecting) return;
                    links.forEach(function (a) { a.removeAttribute("aria-current"); });
                    var link = byId[entry.target.id];
                    if (!link) return;
                    link.setAttribute("aria-current", "true");
                    
                    var list = link.closest(".nav-links");
                    if (list && list.scrollWidth > list.clientWidth) {
                        list.scrollTo({ left: link.offsetLeft - 16, behavior: "smooth" });
                    }
                });
            }, { rootMargin: "-40% 0px -55% 0px" });
            Object.keys(byId).forEach(function (id) {
                var section = document.getElementById(id);
                if (section) observer.observe(section);
            });
        }

        
        var toggle = document.querySelector("[data-toggle-abstracts]");
        var abstracts = document.querySelectorAll("details.abstract");
        if (toggle && abstracts.length) {
            toggle.hidden = false;
            toggle.addEventListener("click", function () {
                var open = toggle.getAttribute("aria-pressed") !== "true";
                abstracts.forEach(function (d) { d.open = open; });
                toggle.setAttribute("aria-pressed", String(open));
                toggle.textContent = open ? "Hide all abstracts" : "Show all abstracts";
            });
        }
    })();
</script>
