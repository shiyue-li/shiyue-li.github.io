disableKinds = ["taxonomy", "term"]

# Lets the templates resize photos in static/img automatically,
# so the page loads small versions instead of the multi-MB originals.
[module]
    [[module.mounts]]
        source = "static"
        target = "static"
    [[module.mounts]]
        source = "assets"
        target = "assets"
    [[module.mounts]]
        source = "static/img"
        target = "assets/img"

[params]
    description = "Shiyue Li 李詩樂 (李诗乐), Donald J. Lewis Assistant Professor of Mathematics at the University of Michigan. Algebraic geometry and combinatorics."
    description_photo = "avatar.jpg"
    favicon = "favicon.png"
    logo = "logo.png"

[params.nav]
    enable = true

[params.hero]
    enable = true
    avatar = "avatar.jpg"
    subtitle = "Shiyue Li 李詩樂"
    position = "Donald J. Lewis Assistant Professor"
    affiliation = "Department of Mathematics, University of Michigan"
    hero_right = [
    "I am a Donald J. Lewis assistant professor at the [University of Michigan](https://lsa.umich.edu/math), mentored by [David Speyer](https://websites.umich.edu/~speyer/).",
    "I work in algebraic geometry and combinatorics. More specifically, I study combinatorial structures in algebraic varieties and their moduli spaces. I am broadly interested in questions connected to number theory, algebraic topology, and algebraic K-theory.",
    "From 2023 to 2025, I was a member at the [Institute for Advanced Study](https://www.ias.edu), mentored by [June Huh](https://web.math.princeton.edu/~huh/), and [Federico Ardila-Mantilla](https://fardila.com).",
    "In 2023, I did my PhD in mathematics at [Brown University](https://www.brown.edu/academics/math/), where I was fortunate to be advised by [Melody Chan](https://www.math.brown.edu/~mtchan/).",
    "Prior, I spent wonderful four years at [Harvey Mudd College](https://www.hmc.edu); my undergrad thesis work was guided by [Dagan Karp](https://www.math.hmc.edu/~dk/).",
    ]
    # Highlighted note shown under the bio. Delete the line to hide it.
    notice = "I am on the job market for academic positions, or research positions concerning AI safety and alignment (for general humanity or for mathematics), starting 2027."

    # Links shown under your name.
    [[params.hero.links]]
        name = "CV"
        url = "/shiyueli-website-2026.pdf"
    [[params.hero.links]]
